name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/crypto-exchange

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          # DL3008/DL3013: we deliberately don't pin every apt/pip transitive
          # version here (Django 4.1's dependency ceiling is pinned in
          # requirements.txt instead) -- see the deploy repo's docs/CVE-TRIAGE.md.
          # DL3025: CMD deliberately uses shell form (not JSON) so gunicorn's
          # --workers can expand $GUNICORN_WORKERS from the ConfigMap while
          # still `exec`ing into PID 1 for correct SIGTERM handling.
          ignore: DL3008,DL3013,DL3025

  build:
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tags.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tags
        run: |
          SHA_TAG="sha-$(git rev-parse --short HEAD)"
          echo "tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Never tag :latest -- deploys are always pinned to an immutable
      # commit SHA (or, on a git tag push, a semver tag) so a rollback is
      # always "redeploy this exact known-good reference", never
      # "whatever :latest happens to resolve to right now".
      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.tag }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:{1}', env.IMAGE, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ needs.build.outputs.image_tag }}
          severity: HIGH,CRITICAL
          # Every suppressed finding in .trivyignore carries a written
          # justification and an expiry date -- see the deploy repo's
          # docs/CVE-TRIAGE.md (aaronmhmr/crypto-exchange-deploy).
          # A HIGH/CRITICAL finding NOT in .trivyignore fails the build.
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif
          if-no-files-found: ignore

  # The deploy job lives in the deploy repo (aaronmhmr/crypto-exchange-deploy),
  # which watches this image tag and applies the Kubernetes manifests --
  # this repo's CI stops at "image built, scanned, published to GHCR".
